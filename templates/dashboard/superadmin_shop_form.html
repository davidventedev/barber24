{% extends "base_app.html" %}
{% block title %}Nueva tienda — {{ BRAND_NAME }}{% endblock %}
{% block content %}
<header class="page-header"><h1>Nueva tienda</h1></header>
<form method="post" enctype="multipart/form-data" class="panel">
  {% csrf_token %}
  <h3 style="color:var(--primary);margin-bottom:1rem;">Barbería</h3>
  {% for field in form %}
  <div class="form-group">
    <label class="form-label">{{ field.label }}</label>
    {{ field }}
  </div>
  {% endfor %}
  <h3 style="color:var(--primary);margin:1.5rem 0 1rem;">Dueño</h3>
  <div class="form-group">
    <label class="form-label">Email del dueño</label>
    <input class="form-input" type="email" name="owner_email" required>
  </div>
  <div class="form-group">
    <label class="form-label">Contraseña</label>
    <input class="form-input" type="password" name="owner_password" required>
  </div>
  <div class="form-group">
    <label class="form-label">Nombre</label>
    <input class="form-input" type="text" name="owner_first_name">
  </div>
  <div class="form-group">
    <label class="form-label">Apellido</label>
    <input class="form-input" type="text" name="owner_last_name">
  </div>
  <button class="btn btn-primary btn-block" type="submit">Crear tienda</button>
</form>
{% endblock %}
